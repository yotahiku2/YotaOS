name: YotaOS source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate build sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n build/build.sh
          bash -n build/prepare-upstream.sh
          bash -n build/apply-yotaos.sh
          bash -n build/yotaos/config/branding.sh
          bash -n build/yotaos/root-overlay/usr/lib/yotaos/branding.sh
          bash -n build/yotaos/root-overlay/var/lib/livesys/livesys-session-extra
          bash -n build/yotaos/root-overlay/usr/libexec/yotaos/security-tool
          bash -n scripts/preview-security-menu.sh

      - name: Validate image definitions and branding
        run: |
          python3 -m py_compile scripts/check-security-packages.py
          python3 scripts/validate-source.py
